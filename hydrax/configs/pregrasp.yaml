# Pregrasp OCP tuning 

# Residual names, their
# formulas and the rules for `reference` are in doc/cost_residuals.md; an
# unknown name is an error listing the available ones.
#
# Every entry states its own weight, reference, and activation.
# Omitting activation
# means quadratic; it is written out here anyway so the file is self-contained.
#
# activation:
#   quadratic -> 0.5 * sum_i w_i r_i^2                (WeightedQuad)
#   smooth_l1 -> sum_i w_i (sqrt(r_i^2 + knee^2) - knee)  (Smooth1Norm)
#                needs `knee`, in the RESIDUAL's own units (m, rad, or
#                N.m/tau_max): below it the term is quadratic and the arm
#                settles, above it the pull is a constant w. It is the
#                accuracy you choose to stop at.
#   saturated -> 1 - exp(-sum_i w_i r_i^2), bounded to [0,1); its curvature
#                decays to zero, which once blinded the OCP to the control.
#
# `weight` may be a scalar or one value per residual component, e.g.
#   joint_position_plan: {weight: [10,10,10,10,10,10,1.0], activation: quadratic}
#
# A `_plan` suffix means the reference is the time-varying quintic joint plan
# carried on userdata; an unsuffixed name needs an explicit `reference` here.
# Weights are ABSOLUTE, and their scale is what solver.temperature is matched
# against — change one and check gain_ess (healthy 50-250).

costs:
  running:
    joint_position: {weight: 1.0, reference: plan, activation: quadratic}
    joint_velocity: {weight: 0.1, reference: plan, activation: quadratic}
    control: {weight: 0.0001, reference: gravity, activation: quadratic}
    ee_translation:
      {weight: 1.4, reference: goal, activation: smooth_l1, knee: 0.001} # 1 mm
    ee_rotation:
      {weight: 0.3, reference: goal, activation: smooth_l1, knee: 0.01} # rad
  terminal:
    joint_position: {weight: 1.0, reference: plan, activation: quadratic}
    joint_velocity: {weight: 0.1, reference: plan, activation: quadratic}
    ee_translation:
      {weight: 1.4, reference: goal, activation: smooth_l1, knee: 0.001} # 1 mm
    ee_rotation:
      {weight: 0.3, reference: goal, activation: smooth_l1, knee: 0.01} # rad

solver:
  num_samples: 1024
  noise_scale: 0.03 # sampling std = noise_scale * tau_max, per joint
  temperature: 0.01 # tunes the softmax and the Ricatti gains
  mean_adaptation_rate: 1.0 # <1 damps the hold jitter (partial mean update)
  num_knots: 4
  spline_type: linear # knot interpolation: zero, linear or cubic (gains need knot-linearity); linear measured calmer at the hold than cubic
  num_steps: 8 # 8 with frictionloss to true, prediction horizon in control steps; seconds = num_steps * model.dt
  iterations: 1
  num_gain_samples: 256 # gain batch: zero-noise nominal + lowest-cost samples

# MuJoCo's Newton budget for the derived planning model. 
# 5/8 converges the seven friction constraints to machine precision
# (2.8e-17 rad over one 8-step horizon). Lowering further is a false
# economy — the line search binds first, so 3/5 costs 7.1e-3 rad and 2/4
# costs 2.9e-2 rad for only a few ms.
model:
  solver_iterations: 5
  solver_ls_iterations: 8
  # false zeroes the planning model's friction at load (file untouched).
  # The only constraint source here: 30.1 -> 10.7 ms/solve, but 3.14 -> 21.66 mm.
  with_frictionloss: true
  # Control period and the model's physics timestep (one step per control
  # step). The bridge's publish_rate_hz must be 1 / dt.
  dt: 0.04 # 0.04 with frictionloss to true, if you change this check as well hydrax_bridge.yaml in ros

plan:
  duration_sec: 7.5
  max_velocity_fraction: 0.20

# The feedforward-mode low level: per-joint impedance published to LFC as
# K = -[diag(kp) | diag(kd)], anchored on the plan reference. Values from
# the real LFC configuration. Not used in exact_feedback mode.
feedforward:
  kp: [1000.0, 1000.0, 1000.0, 1000.0, 20.0, 10.0, 5.0]
  kd: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 1.0]
