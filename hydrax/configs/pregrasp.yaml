# Pregrasp OCP tuning — THE single tuning surface for the Tier A gates,
# the ROS simulation, and the real robot (all consumers load this file
# through hydrax.tasks.panda_pregrasp.load_pregrasp_config; nothing can
# override it from the ROS parameter layer).
#
# Values only: cost functions and everything not listed here (goal pose,
# robot limits, domain randomization) are code, in PandaPregraspOptions /
# PregraspControllerConfig, and changing them is a reviewed code change.
# Unknown keys in this file are an error.
#
# The committed values are the configuration certified by the Tier A gates
# (doc/feedback_mppi_panda_port_plan.md). Tune freely for experiments —
# both the Tier A example and the ROS bringup read the same file — and
# rerun the gates before trusting a changed value.

costs:
  # Activation applied to each squared residual (crocoddyl's ActivationModel):
  #   quadratic -> 0.5|r|^2, constant Hessian (ActivationModelWeightedQuad)
  #   saturated -> 1 - exp(-|r|^2), bounded to [0,1) but its curvature decays
  #                to zero, which blinds the OCP to the control
  # Weights below are ABSOLUTE (not normalized against each other) and are
  # tuned for `quadratic`; selecting `saturated` needs them and `temperature`
  # retuned together.
  activation: quadratic
  # Proportions from crocoddyl's canonical reaching OCPs: tracking 10,
  # state regularization 1e-1, control regularization 1e-4.
  configuration_weight: 10.0
  velocity_weight: 0.1
  control_weight: 0.0001

solver:
  num_samples: 1024
  noise_scale: 0.03 # sampling std = noise_scale * tau_max, per joint
  temperature: 0.007
  mean_adaptation_rate: 1.0 # <1 damps the hold jitter (partial mean update)
  num_knots: 4
  spline_type: linear # knot interpolation: zero, linear or cubic (gains need knot-linearity); linear measured calmer at the hold than cubic
  plan_horizon: 0.32 # seconds (8 steps; H is the sequential depth of both the sampling and the gain path)
  iterations: 1
  num_gain_samples: 256 # gain batch: zero-noise nominal + lowest-cost samples

# MuJoCo's Newton budget for the derived planning model. Contacts are
# disabled there, so before the identified joint friction the model carried
# no constraints and these were free at MuJoCo's 100/50 default. Friction
# adds one constraint per joint and MJX runs every iteration it is given, on
# every sample of every rollout step: 100/50 measured ~125 ms per control
# step against the 40 ms budget, 5/8 measured ~29 ms.
#
# 5/8 converges the seven friction constraints to machine precision
# (2.8e-17 rad over one 8-step horizon). Lowering further is a false
# economy — the line search binds first, so 3/5 costs 7.1e-3 rad and 2/4
# costs 2.9e-2 rad for only a few ms.
model:
  solver_iterations: 5
  solver_ls_iterations: 8

plan:
  duration_sec: 7.5
  max_velocity_fraction: 0.20

# The feedforward-mode low level: per-joint impedance published to LFC as
# K = -[diag(kp) | diag(kd)], anchored on the plan reference. Values from
# the real LFC configuration. Not used in exact_feedback mode.
feedforward:
  kp: [1000.0, 1000.0, 1000.0, 1000.0, 20.0, 10.0, 5.0]
  kd: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 1.0]
