# Pregrasp OCP tuning 

# The cost is crocoddyl's CostModelSum: one weighted residual per entry
# below. THE TERM LIST IS THE CONTROLLER — swapping which residuals appear
# here changes what is optimized, with no code change. Residual names, their
# formulas and the rules for `reference` are in doc/cost_residuals.md; an
# unknown name is an error listing the available ones.
#
# An entry is either the weight on its own, or a mapping when the residual
# needs a constant reference:
#
#   control_grav: 0.0001
#   joint_position_plan: [10, 10, 10, 10, 10, 10, 1.0]   # per-joint weights
#   joint_position:
#     weight: 1.0
#     reference: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
#
# A `_plan` suffix means the reference is the time-varying quintic joint plan
# carried on userdata; the unsuffixed name means a constant that must be given
# explicitly here — there is no default reference.

costs:
  # Activation applied to each term's weighted squared residual (crocoddyl's
  # ActivationModel):
  #   quadratic -> 0.5 * sum_i w_i r_i^2, constant Hessian
  #                (ActivationModelWeightedQuad)
  #   saturated -> 1 - exp(-sum_i w_i r_i^2), bounded to [0,1) but its
  #                curvature decays to zero, which blinds the OCP to the
  #                control
  # Weights are ABSOLUTE (not normalized against each other) and are tuned
  # for `quadratic`; selecting `saturated` needs them and `temperature`
  # retuned together.
  activation: quadratic

  # Proportions from crocoddyl's canonical reaching OCPs: tracking 10,
  # state regularization 1e-1, control regularization 1e-4.
  running:
    joint_position_plan: 10.0
    joint_velocity_plan: 0.1
    control_grav: 0.0001

  # The terminal drops the control term, as crocoddyl's terminal CostModelSum
  # does: there is no control at that node to regularize. A control-dependent
  # residual here is an error.
  terminal:
    joint_position_plan: 10.0
    joint_velocity_plan: 0.1

solver:
  num_samples: 1024
  noise_scale: 0.03 # 0.03 for frictionloss to true, sampling std = noise_scale * tau_max, per joint
  temperature: 0.007 # 0.007 for frictionloss to true
  mean_adaptation_rate: 1.0 # <1 damps the hold jitter (partial mean update)
  num_knots: 4
  spline_type: linear # knot interpolation: zero, linear or cubic (gains need knot-linearity); linear measured calmer at the hold than cubic
  num_steps: 8 # 8 with frictionloss to true, prediction horizon in control steps; seconds = num_steps * model.dt
  iterations: 1
  num_gain_samples: 256 # gain batch: zero-noise nominal + lowest-cost samples

# MuJoCo's Newton budget for the derived planning model. 
# 5/8 converges the seven friction constraints to machine precision
# (2.8e-17 rad over one 8-step horizon). Lowering further is a false
# economy — the line search binds first, so 3/5 costs 7.1e-3 rad and 2/4
# costs 2.9e-2 rad for only a few ms.
model:
  solver_iterations: 5
  solver_ls_iterations: 8
  # false zeroes the planning model's friction at load (file untouched).
  # The only constraint source here: 30.1 -> 10.7 ms/solve, but 3.14 -> 21.66 mm.
  with_frictionloss: true
  # Control period and the model's physics timestep (one step per control
  # step). The bridge's publish_rate_hz must be 1 / dt.
  dt: 0.04 # 0.04 with frictionloss to true, if you change this check as well hydrax_bridge.yaml in ros

plan:
  duration_sec: 7.5
  max_velocity_fraction: 0.20

# The feedforward-mode low level: per-joint impedance published to LFC as
# K = -[diag(kp) | diag(kd)], anchored on the plan reference. Values from
# the real LFC configuration. Not used in exact_feedback mode.
feedforward:
  kp: [1000.0, 1000.0, 1000.0, 1000.0, 20.0, 10.0, 5.0]
  kd: [5.0, 5.0, 5.0, 5.0, 2.0, 2.0, 1.0]
